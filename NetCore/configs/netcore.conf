# ==============================================================
# NetCore - High-Performance TCP/IP Networking Stack Configuration
# ==============================================================

# TCP listening port
server_port=8080

# UDP listening port
udp_port=8081

# Number of worker threads for packet and message processing
worker_threads=8

# Maximum simultaneous active client connections
max_connections=10000

# Listen backlog queue depth
backlog=4096

# Socket read/write buffer size in bytes
buffer_size=8192

# Enable TCP Keep-Alive probes
keepalive=true

# Disable Nagle's algorithm for low-latency transmission
tcp_nodelay=true

# Logging verbosity: DEBUG, INFO, WARNING, ERROR
log_level=INFO

# Log output file
log_file=logs/netcore.log

# Connection idle timeout in seconds (inactive sockets closed)
connection_timeout=30

# Interface address to bind
bind_address=0.0.0.0

# Telemetry monitoring port
stats_port=8082
